<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plymouth Map</title>
  <meta name="description"
        content="Plymouth Map: an interactive map of Plymouth, Minnesota precincts, wards and election history.">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css?v=20261003a">
  <link rel="stylesheet" href="css/wards.css?v=20261003a">
</head>
<body>
  <header id="site-header">
    <div class="site-title">
      <h1>Plymouth Map</h1>
      <p>Plymouth, MN precincts and elections</p>
    </div>
    <nav id="site-tabs" aria-label="Site sections">
      <button class="site-tab active" data-tab="warroom">Path to Win</button>
      <button class="site-tab" data-tab="map">Map</button>
      <button class="site-tab" data-tab="wards">Ward History</button>
      <button class="site-tab" data-tab="record">Voting Record</button>
    </nav>
  </header>

  <section id="tab-warroom" class="tab-panel active" data-tab-panel="warroom">
    <div id="warroom-content" class="warroom-content">
      <div class="panel-empty"><h2>Loading…</h2></div>
    </div>
  </section>

  <section id="tab-map" class="tab-panel" data-tab-panel="map">
    <nav id="layer-picker" aria-label="Map controls">
      <div class="picker-selects">
        <label class="picker-field">
          <span class="picker-label">Show</span>
          <select id="layer-select" aria-label="Map layer">
            <option value="precincts">Precincts</option>
            <option value="wards">Wards</option>
            <option value="house">MN House districts</option>
            <option value="senate">MN Senate districts</option>
            <option value="congress">U.S. House district</option>
          </select>
        </label>
        <label class="picker-field">
          <span class="picker-label">Color by</span>
          <select id="view-select" aria-label="Color the map by">
            <optgroup label="Campaign">
              <option value="priority">Partisan-lean tier (2024 DFL share)</option>
              <option value="targeting">Targeting tier (Tier 1/2/3/Base)</option>
              <option value="turnout">2022 turnout</option>
            </optgroup>
            <optgroup label="Elections">
              <option value="margin">Vote margin (latest top of ticket)</option>
            </optgroup>
            <optgroup label="Census">
              <option value="income">Median household income</option>
              <option value="age">Median age</option>
              <option value="diversity">Residents of color</option>
            </optgroup>
          </select>
        </label>
        <label class="picker-field">
          <span class="picker-label">Overlay</span>
          <select id="overlay-select" aria-label="Demographic overlay">
            <option value="">None</option>
            <option value="income">Income</option>
            <option value="age">Age</option>
            <option value="diversity">Residents of color</option>
          </select>
        </label>
      </div>
      <div class="picker-actions">
        <button id="topbar-scenario-btn" title="Model 2026 turnout and environment scenarios">Scenario model</button>
        <button id="topbar-clark-btn" title="Map the candidate's 2022 precinct performance">Candidate map</button>
        <button id="split-toggle" title="Side-by-side comparison of two election years">Compare years</button>
        <button id="export-btn" title="Download a clean, presentation-ready map graphic">Export slide</button>
      </div>
    </nav>

    <main id="map-wrap">
      <div id="map" aria-label="Map of Plymouth, Minnesota"></div>
      <div id="legend"></div>
      <div id="split-control" hidden>
        <div id="split-divider"><div id="split-handle" role="slider"
             aria-label="Drag to compare years" aria-valuemin="0" aria-valuemax="100">⇆</div></div>
        <select id="split-left" class="split-year" aria-label="Left year"></select>
        <select id="split-right" class="split-year" aria-label="Right year"></select>
      </div>
    </main>

    <aside id="panel">
      <div id="cand-search">
        <input id="cand-input" type="search"
               placeholder="Search any candidate (Harris, Walz, Morrison…)"
               autocomplete="off" aria-label="Search candidates">
        <div id="cand-results" hidden></div>
      </div>
      <div id="panel-content">
        <div class="panel-empty">
          <h2>Loading…</h2>
        </div>
      </div>
    </aside>

    <footer id="credits">
      Data: <a href="https://electionresults.sos.mn.gov" target="_blank" rel="noopener">MN Secretary of State</a> ·
      <a href="https://gis-hennepin.hub.arcgis.com/" target="_blank" rel="noopener">Hennepin County GIS</a> ·
      <a href="https://www.census.gov/programs-surveys/acs" target="_blank" rel="noopener">Census ACS 2023</a>
    </footer>
  </section>

  <section id="tab-wards" class="tab-panel" data-tab-panel="wards">
    <div id="wards-content" class="wh-root">
      <div class="panel-empty"><h2>Loading…</h2></div>
    </div>
  </section>

  <section id="tab-record" class="tab-panel" data-tab-panel="record">
    <div id="record-content" class="record-content">
      <div class="panel-empty"><h2>Loading…</h2></div>
    </div>
  </section>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/tabs.js?v=20261003a"></script>
  <script src="js/app.js?v=20261003a"></script>
  <script src="js/warroom.js?v=20261003a"></script>
  <script src="js/record.js?v=20261003a"></script>
  <script src="js/wards.js?v=20261002a"></script>
  <script src="js/history-map.js?v=20261002b"></script>
</body>
</html>
